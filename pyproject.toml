[project]
name = "citydiffusion2"
version = "0.1.0"
description = "Interactive pixel-space city map diffusion visualizer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "diffusers>=0.40.0",
    "fastapi>=0.141.1",
    "huggingface-hub",
    "numpy",
    "pillow",
    "pydantic>=2",
    "safetensors",
    "torch>=2.6",
    "torchvision",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
